# CI runs the SonarCloud scanner (.github/workflows/check-pull-request.yml and
# publish.yml), which reads sonar-project.properties. This file is read only if
# SonarQube Cloud Automatic Analysis is switched on for the repo, and then only
# the subset of properties below. Keep in step with sonar-project.properties: change one, change the other.

sonar.sources=src/
sonar.exclusions=src/**/*.test.js,src/**/*.fit.spec.js,src/**/fit/**
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js,src/**/*.fit.spec.js,src/**/fit/**

sonar.cpd.exclusions=**/config.js,src/**/*.test.js,src/**/*.fit.spec.js,src/**/fit/**
