# SonarQube Cloud runs Automatic Analysis on this repo — the scanner steps in
# .github/workflows/ are still commented out — and Automatic Analysis ignores
# sonar-project.properties. It reads this file instead, and only the subset of
# properties below. Keep the two files in step: change one, change the other.

sonar.sources=src/
sonar.exclusions=src/**/*.test.js,src/**/*.fit.spec.js
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js,src/**/*.fit.spec.js
