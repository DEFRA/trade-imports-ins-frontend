# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_trade-imports-ins-frontend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/trade-imports-ins-frontend
sonar.links.ci=https://github.com/DEFRA/trade-imports-ins-frontend/actions
sonar.links.scm=https://github.com/DEFRA/trade-imports-ins-frontend
sonar.links.issue=https://github.com/DEFRA/trade-imports-ins-frontend/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js,src/**/*.fit.spec.js,src/**/fit/**
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js,src/**/*.fit.spec.js,src/**/fit/**

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# The reference-data capture is a command run by hand against a live stack, never by the app.
sonar.coverage.exclusions=src/client/**,src/server/app/services/_capture/capture.js

# Each locale's copy file mirrors the others' keys by design.
sonar.cpd.exclusions=**/config.js,src/**/copy/copy.*.js,src/**/*.test.js,src/**/*.fit.spec.js,src/**/fit/**
