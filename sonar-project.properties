# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_trade-imports-ins-frontend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/trade-imports-ins-frontend
sonar.links.ci=https://github.com/DEFRA/trade-imports-ins-frontend/actions
sonar.links.scm=https://github.com/DEFRA/trade-imports-ins-frontend
sonar.links.issue=https://github.com/DEFRA/trade-imports-ins-frontend/issues

# `src/**/fit/**` is the Playwright suite — specs and the page-object helpers
# beside them. `npm test` is vitest and never runs it (`npm run test:fit` does,
# and produces no lcov), so without this it is scanned as production source that
# no test covers: 288 uncovered lines, and rules like S138/S1192 reported against
# test code. Matched by directory rather than by `*.fit.spec.js` because the
# helpers (address-form.js, seed-address.js) don't carry the spec suffix.
sonar.sources=src/
sonar.exclusions=src/**/*.test.js,src/**/fit/**
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js,src/**/fit/**

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# The browser bundle is exercised by the Playwright suite, not by vitest.
sonar.coverage.exclusions=src/client/**

sonar.cpd.exclusions=**/config.js,src/**/*.test.js,src/**/fit/**
